name: Android family build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest :student:assembleDebug :parent:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: studylock-student-debug-apk
          path: student/build/outputs/apk/debug/student-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: studylock-parent-debug-apk
          path: parent/build/outputs/apk/debug/parent-debug.apk
