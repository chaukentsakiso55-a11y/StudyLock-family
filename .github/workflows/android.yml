name: StudyLock unified APK build

on:
  pull_request:
  push:
    branches: ["studylock-unified-apk-build"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STUDYLOCK_FIREBASE_API_KEY: ${{ secrets.STUDYLOCK_FIREBASE_API_KEY }}
      STUDYLOCK_FIREBASE_PROJECT_ID: studylock-family
      STUDYLOCK_TEACHER_FIREBASE_APP_ID: ${{ secrets.STUDYLOCK_TEACHER_FIREBASE_APP_ID }}
      STUDYLOCK_FIREBASE_STORAGE_BUCKET: studylock-family.firebasestorage.app
      STUDYLOCK_OFFLINE_LIBRARY_STORAGE_PATH: offline-tutor-library/studylock-reference-library-v1.db
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify unified StudyLock source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/studylock-source.b64
          for n in $(seq -w 1 17); do
            test -s "ci/source.part.${n}"
            cat "ci/source.part.${n}" >> /tmp/studylock-source.b64
          done
          base64 --decode /tmp/studylock-source.b64 > /tmp/StudyLock-Unified-CI-Source.zip
          echo "0f90af9add3c567f56874278384e054a49fbf65a16c4d7b3b5efd8d33e2c86e0  /tmp/StudyLock-Unified-CI-Source.zip" | sha256sum -c -
          unzip -oq /tmp/StudyLock-Unified-CI-Source.zip -d .
          if [ ! -f studylock-exact.html ] && [ -f app/src/main/assets/studylock-exact.html ]; then
            cp app/src/main/assets/studylock-exact.html studylock-exact.html
          fi
          grep -q 'include(":teacher")' settings.gradle.kts
          grep -q 'include(":parent")' settings.gradle.kts
          grep -q 'include(":wear")' settings.gradle.kts

      - name: Ensure Teacher uses the same Firebase client configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STUDYLOCK_FIREBASE_API_KEY:-}" ]; then
            KEY=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text()
          m = re.search(r'STUDYLOCK_FIREBASE_API_KEY"\s*,\s*"([^"]+)"', text)
          if not m:
              raise SystemExit('Firebase client key fallback not found')
          print(m.group(1))
          PY
            )
            echo "::add-mask::$KEY"
            echo "STUDYLOCK_FIREBASE_API_KEY=$KEY" >> "$GITHUB_ENV"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate AI backend
        working-directory: functions
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          node -e "require('./index.js')"

      - name: Build bundled offline dictionary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dictionary-build
          npm install --prefix .dictionary-build wordnet-db@3.1.14 --ignore-scripts --no-audit --no-fund
          python3 scripts/build_offline_dictionary.py \
            --wordnet-dir .dictionary-build/node_modules/wordnet-db/dict \
            --output app/src/main/assets/studylock_dictionary.db \
            --cache-dir .dictionary-cache
          python3 scripts/check_offline_dictionary.py app/src/main/assets/studylock_dictionary.db

      - name: Verify StudyLock JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          node scripts/check-quiz-gate.js
          node scripts/check-no-fullscreen-regression.js
          node scripts/check-protection-onboarding.js
          node scripts/check-auto-ai-offline-dictionary.js
          node scripts/check-downloadable-offline-library.js

      - name: Assemble Student Parent Teacher and Wear APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :parent:assembleDebug \
            :teacher:assembleDebug \
            :wear:assembleDebug \
            --stacktrace --no-daemon

      - name: Stage APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/studylock-student.apk
          cp parent/build/outputs/apk/debug/parent-debug.apk build-artifacts/studylock-parent.apk
          cp teacher/build/outputs/apk/debug/teacher-debug.apk build-artifacts/studylock-teacher.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk build-artifacts/studylock-wear.apk
          sha256sum build-artifacts/*.apk > build-artifacts/SHA256SUMS.txt
          ls -lh build-artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyLock-Unified-APKs
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 14
